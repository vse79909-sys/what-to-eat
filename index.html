<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>吃什么 - 小两口专属家庭点菜与排餐系统</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: 'var(--brand-50, #fff7ed)',
              100: 'var(--brand-100, #ffedd5)',
              200: 'var(--brand-200, #fed7aa)',
              300: 'var(--brand-300, #fdba74)',
              400: 'var(--brand-400, #fb923c)',
              500: 'var(--brand-500, #f97316)',
              600: 'var(--brand-600, #ea580c)',
              700: 'var(--brand-700, #c2410c)',
            },
            cream: '#FAF7F2'
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(249, 115, 22, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04)',
            'card': '0 8px 30px rgba(0,0,0,0.06)'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css?v=20260923_v8">
  <script>
    // 在页面渲染前立即应用保存的 UI 设定，避免界面闪烁
    try {
      const savedUi = JSON.parse(localStorage.getItem('wt_ui_settings') || '{}');
      const bClasses = [];
      bClasses.push(savedUi.density === 'compact' ? 'density-compact' : 'density-comfortable');
      if (savedUi.dishLayout === 'single-col') bClasses.push('layout-single-col');
      if (savedUi.theme) bClasses.push(`theme-${savedUi.theme}`);
      if (savedUi.radius) bClasses.push(`radius-${savedUi.radius}`);
      if (savedUi.fontSize === 'large') bClasses.push('font-large');
      document.documentElement.className = bClasses.join(' ');
    } catch(e) {}
  </script>
</head>
<body class="bg-cream text-stone-800 min-h-screen pb-24 md:pb-12 font-sans antialiased selection:bg-brand-100">

  <!-- 顶部轻量化导航 -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-stone-200/70 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-2.5 sm:py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-tr from-brand-500 to-amber-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20 flex-shrink-0">
          <i data-lucide="utensils" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-black tracking-tight text-stone-900 flex items-center gap-1.5 leading-none">
            吃什么
            <span class="text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-rose-50 text-rose-500 font-semibold border border-rose-100 flex items-center gap-1">
              <i data-lucide="heart" class="w-2.5 h-2.5 fill-rose-500"></i> 家常菜谱
            </span>
          </h1>
          <p class="text-[11px] sm:text-xs text-stone-400 font-medium mt-0.5">小两口专属点菜 · 今天想吃哪一道？</p>
        </div>
      </div>

      <!-- 快捷导航按钮（电脑端） -->
      <nav class="hidden md:flex items-center p-1 bg-stone-100 rounded-xl space-x-1 text-sm font-semibold">
        <button onclick="switchTab('plan')" class="tab-btn px-4 py-1.5 rounded-lg transition-all" data-tab="plan">
          <span class="flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4"></i>周排餐</span>
        </button>
        <button onclick="switchTab('dishes')" class="tab-btn px-4 py-1.5 rounded-lg transition-all" data-tab="dishes">
          <span class="flex items-center gap-1.5"><i data-lucide="book-open" class="w-4 h-4"></i>菜品大厅</span>
        </button>
        <button onclick="switchTab('add')" class="tab-btn px-4 py-1.5 rounded-lg transition-all" data-tab="add">
          <span class="flex items-center gap-1.5"><i data-lucide="camera" class="w-4 h-4"></i>拍照/录入</span>
        </button>
        <a href="admin.html" target="_blank" class="px-3.5 py-1.5 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-200/60 transition-all flex items-center gap-1.5 text-xs font-bold" title="打开大厨专属后台管理网站">
          <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>后台管理 ↗
        </a>
      </nav>
    </div>
  </header>

  <!-- 主体内容容器 -->
  <main class="max-w-4xl mx-auto px-3.5 sm:px-4">

    <!-- 1. 周排餐面板 (Plan Tab) -->
    <section id="tab-plan" class="tab-content">
      <!-- 顶部控制条：周切换 -->
      <div class="bg-gradient-to-br from-amber-500/10 via-brand-500/5 to-rose-500/10 border border-brand-200/60 rounded-3xl p-3.5 sm:p-5 shadow-soft space-y-3">
        <!-- 第 1 行：本周菜单 与 具体日期 -->
        <div class="flex items-center justify-between">
          <span id="current-week-label" class="text-xs sm:text-sm font-bold text-brand-700 bg-brand-100/90 px-3 py-0.5 rounded-full">本周菜单</span>
          <span id="today-date-text" class="text-xs text-stone-500 font-medium"></span>
        </div>

        <!-- 第 2 行：周切换按钮组（完全依照用户第 2 张图片样式） -->
        <div class="flex items-center gap-2.5">
          <button onclick="changeWeek(-1)" class="px-3.5 py-1.5 bg-white border border-stone-200/90 hover:bg-stone-50 text-stone-700 rounded-full text-xs font-bold shadow-sm flex items-center gap-1 active:scale-95 transition-all">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5 stroke-[2.5]"></i>
            <span>上周</span>
          </button>
          <button onclick="resetToCurrentWeek()" class="px-4 py-1.5 bg-brand-500 hover:bg-brand-600 text-white rounded-full text-xs font-bold shadow-sm shadow-brand-500/25 active:scale-95 transition-all">
            返回今天
          </button>
          <button onclick="changeWeek(1)" class="px-3.5 py-1.5 bg-white border border-stone-200/90 hover:bg-stone-50 text-stone-700 rounded-full text-xs font-bold shadow-sm flex items-center gap-1 active:scale-95 transition-all">
            <span>下周</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 stroke-[2.5]"></i>
          </button>
        </div>

        <!-- 星期横向滑动条 (周一至周日) -->
        <div class="pt-0.5 flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="week-day-selector">
          <!-- 动态渲染 7 天胶囊按钮 -->
        </div>
      </div>

      <!-- 当天午餐与晚餐明细卡片 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5" id="day-meal-container">
        <!-- 午餐区域 -->
        <div class="bg-white rounded-3xl border border-stone-200/80 p-4 sm:p-5 shadow-soft relative overflow-hidden">
          <div class="absolute top-0 right-0 w-24 h-24 bg-amber-100/40 rounded-bl-full -z-0 pointer-events-none"></div>
          <div class="flex items-center justify-between mb-3.5 relative z-10">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center font-bold">
                <i data-lucide="sun" class="w-4 h-4"></i>
              </div>
              <div>
                <h3 class="font-black text-stone-900 text-sm sm:text-base">☀️ 午餐安排</h3>
                <p class="text-[11px] text-stone-400">元气满满的中午时光</p>
              </div>
            </div>
            <button onclick="openDishPicker('lunch')" class="px-3 py-1.5 bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200/80 rounded-xl text-xs font-bold flex items-center gap-1 active:scale-95 transition-all">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 点菜
            </button>
          </div>
          <!-- 午餐菜品列表容器 -->
          <div id="lunch-dish-list" class="space-y-2 min-h-[100px]">
            <!-- 动态渲染 -->
          </div>
        </div>

        <!-- 晚餐区域 -->
        <div class="bg-white rounded-3xl border border-stone-200/80 p-4 sm:p-5 shadow-soft relative overflow-hidden">
          <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-100/40 rounded-bl-full -z-0 pointer-events-none"></div>
          <div class="flex items-center justify-between mb-3.5 relative z-10">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">
                <i data-lucide="moon" class="w-4 h-4"></i>
              </div>
              <div>
                <h3 class="font-black text-stone-900 text-sm sm:text-base">🌙 晚餐安排</h3>
                <p class="text-[11px] text-stone-400">下班后的温馨犒赏</p>
              </div>
            </div>
            <button onclick="openDishPicker('dinner')" class="px-3 py-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200/80 rounded-xl text-xs font-bold flex items-center gap-1 active:scale-95 transition-all">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 点菜
            </button>
          </div>
          <!-- 晚餐菜品列表容器 -->
          <div id="dinner-dish-list" class="space-y-2 min-h-[100px]">
            <!-- 动态渲染 -->
          </div>
        </div>
      </div>

      <!-- 选择困难救星：一键安排菜单 -->
      <div class="bg-white rounded-2xl border border-stone-200/80 p-3.5 sm:p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center flex-shrink-0">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
          </div>
          <div>
            <h4 class="text-xs sm:text-sm font-black text-stone-900">想不出吃啥？一键安排菜单</h4>
            <p class="text-[11px] text-stone-400">大厨算法自动为您搭配荤素均衡的美味组合</p>
          </div>
        </div>
        <button onclick="surpriseMealPlan()" class="w-full sm:w-auto px-4 py-2.5 bg-gradient-to-r from-amber-500 to-brand-500 text-white rounded-xl text-xs font-bold shadow-md shadow-brand-500/20 hover:opacity-95 flex items-center justify-center gap-1.5 active:scale-95 transition-all">
          <i data-lucide="sparkles" class="w-4 h-4"></i> 一键安排菜单
        </button>
      </div>

      <!-- 快捷发给大厨（在空白处） -->
      <div class="pt-1 pb-4">
        <button onclick="shareMealPlanToChef()" class="w-full py-3.5 px-4 bg-gradient-to-r from-rose-500 to-brand-500 text-white font-black rounded-2xl shadow-md shadow-rose-500/20 hover:opacity-95 flex items-center justify-center gap-2 active:scale-98 transition-all text-sm cursor-pointer">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>快捷发给大厨</span>
        </button>
      </div>
    </section>

    <!-- 2. 菜品大厅面板 (Dishes Tab) -->
    <section id="tab-dishes" class="tab-content hidden space-y-4">
      <!-- 搜索与筛选控制台 -->
      <div class="bg-white rounded-3xl border border-stone-200/80 p-3.5 sm:p-4 shadow-soft space-y-3">
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="search-dish-input" oninput="filterDishes()" placeholder="搜索菜名（如：小酥肉、牛肉）..." class="w-full pl-9 pr-3 py-2 bg-stone-50 border border-stone-200 rounded-2xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500">
          </div>
          <button onclick="switchTab('add')" class="px-3.5 py-2 bg-brand-500 text-white rounded-2xl text-xs font-bold shadow-sm shadow-brand-500/20 hover:bg-brand-600 flex items-center gap-1 whitespace-nowrap active:scale-95 transition-all">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> 录入新菜
          </button>
        </div>
        <!-- 分类筛选胶囊 -->
        <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar" id="category-filter-bar">
          <!-- 动态渲染分类 -->
        </div>
      </div>

      <!-- 菜谱网格展示区 -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4" id="dishes-grid">
        <!-- 动态渲染菜品卡片 -->
      </div>
    </section>

    <!-- 3. 拍照/选图录入面板 (Add Tab) -->
    <section id="tab-add" class="tab-content hidden">
      <div class="bg-white rounded-3xl border border-stone-200/80 p-5 md:p-8 shadow-soft max-w-xl mx-auto space-y-5">
        <div>
          <h2 class="text-lg sm:text-xl font-black text-stone-900 flex items-center gap-2">
            <i data-lucide="camera" class="w-5 h-5 sm:w-6 sm:h-6 text-brand-500"></i>
            记录一道新菜
          </h2>
          <p class="text-xs text-stone-400 mt-0.5">支持手机拍照录入或直接从本地相册上传图片</p>
        </div>

        <!-- 拍照 / 本地相册选图上传区 -->
        <div>
          <label class="block text-xs font-bold text-stone-700 mb-2">菜品实拍照片（手机拍照或本地上传）*</label>
          <div id="photo-upload-box" class="w-full aspect-[4/3] rounded-2xl border-2 border-dashed border-stone-300 bg-stone-50/80 flex flex-col items-center justify-center transition-all overflow-hidden relative group">
            <!-- 手机现场拍照 input (带有 capture) -->
            <input type="file" id="camera-file-input" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)">
            <!-- 本地相册 / 电脑本地文件 input (不带 capture) -->
            <input type="file" id="local-file-input" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
            
            <img id="photo-preview-img" class="w-full h-full object-cover hidden" alt="菜品预览">

            <div id="upload-placeholder" class="text-center p-4">
              <div class="w-12 h-12 rounded-full bg-brand-50 text-brand-500 flex items-center justify-center mx-auto mb-2.5">
                <i data-lucide="image-plus" class="w-6 h-6"></i>
              </div>
              <p class="text-xs font-bold text-stone-700 mb-1">为这道菜上传一张诱人照片</p>
              <p class="text-[11px] text-stone-400 mb-3">支持现场拍照或从手机相册、电脑选图</p>
              
              <div class="flex items-center justify-center gap-2">
                <button type="button" onclick="triggerCameraInput()" class="px-3.5 py-1.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 transition-all">
                  <i data-lucide="camera" class="w-3.5 h-3.5"></i> 手机拍照
                </button>
                <button type="button" onclick="triggerLocalFileInput()" class="px-3.5 py-1.5 bg-stone-800 hover:bg-stone-900 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 transition-all">
                  <i data-lucide="folder-image" class="w-3.5 h-3.5"></i> 本地相册/选图
                </button>
              </div>
            </div>

            <!-- 照片已选后的重置悬浮条 -->
            <div id="reupload-overlay" class="absolute bottom-2 left-2 right-2 bg-black/60 backdrop-blur-md p-2 rounded-xl hidden items-center justify-between text-white text-xs">
              <span class="truncate text-[11px] opacity-90 pl-1">照片已就绪</span>
              <div class="flex gap-1.5">
                <button type="button" onclick="triggerCameraInput()" class="px-2.5 py-1 bg-white/20 hover:bg-white/30 rounded-lg text-[11px]">重拍</button>
                <button type="button" onclick="triggerLocalFileInput()" class="px-2.5 py-1 bg-white/20 hover:bg-white/30 rounded-lg text-[11px]">相册更换</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 菜品信息表单 -->
        <div class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">菜品名称 *</label>
            <input type="text" id="new-dish-name" placeholder="例如：秘制可乐鸡翅" class="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">所属分类 *</label>
            <select id="new-dish-category" class="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500">
              <!-- 动态填充分类选项 -->
            </select>
          </div>

          <button onclick="saveNewDish()" class="w-full py-3 bg-gradient-to-r from-brand-500 to-amber-500 text-white font-bold rounded-2xl shadow-md shadow-brand-500/20 hover:opacity-95 transition-all flex items-center justify-center gap-2 active:scale-98">
            <i data-lucide="check" class="w-4 h-4"></i> 保存这道菜到菜谱库
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- 弹窗：点菜选择器 (Dish Picker Modal) -->
  <div id="dish-picker-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-xl max-h-[85vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-slide-up">
      <!-- 弹窗头部 -->
      <div class="p-3.5 sm:p-4 border-b border-stone-100 flex items-center justify-between bg-stone-50/60">
        <div>
          <h3 class="font-black text-stone-900 text-sm sm:text-base flex items-center gap-1.5">
            <span id="picker-target-title" class="text-brand-600">周一 午餐</span>
            <span>· 挑两道想吃的</span>
          </h3>
          <p class="text-[11px] text-stone-400">点击菜品卡片即可直接加入菜单</p>
        </div>
        <button onclick="closeDishPicker()" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-stone-200/80 hover:bg-stone-300 flex items-center justify-center text-stone-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 搜索栏 与 菜品分类滑动条 -->
      <div class="p-3 border-b border-stone-100 space-y-2">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-stone-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="picker-search-input" oninput="filterPickerDishes()" placeholder="搜索想吃的菜名..." class="w-full pl-9 pr-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none focus:border-brand-500">
        </div>
        <!-- 搜索栏下方：菜品分类筛选 -->
        <div class="flex gap-1.5 overflow-x-auto pb-0.5 no-scrollbar" id="picker-category-filter-bar">
          <!-- 动态渲染分类胶囊 -->
        </div>
      </div>

      <!-- 菜品列表滚动区 -->
      <div class="p-3.5 sm:p-4 overflow-y-auto flex-1 grid grid-cols-2 gap-2.5 sm:gap-3" id="picker-dishes-container">
        <!-- 动态渲染可选菜品 -->
      </div>
    </div>
  </div>

  <!-- 弹窗：导入微信点菜 (Import Dish Modal) -->
  <div id="import-dish-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 sm:p-6 shadow-2xl space-y-3.5 animate-slide-up">
      <div class="flex items-center justify-between border-b border-stone-100 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center font-bold">
            <i data-lucide="clipboard-check" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="font-black text-stone-900 text-sm">导入女友点菜清单</h3>
            <p class="text-[11px] text-stone-400">粘贴女友微信发来的内容，一键排入日程</p>
          </div>
        </div>
        <button onclick="closeImportModal()" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-stone-100 hover:bg-stone-200 flex items-center justify-center text-stone-500">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div>
        <label class="block text-xs font-bold text-stone-700 mb-1.5">微信点菜内容：</label>
        <textarea id="import-text-input" rows="5" placeholder="请在此粘贴女友微信发来的文字，例如：&#10;☀️ 午餐：秘制可乐鸡翅、经典番茄炒蛋&#10;🌙 晚餐：招牌红烧肉、老火玉米排骨汤" class="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none focus:border-brand-500 leading-relaxed font-sans"></textarea>
      </div>

      <div class="flex items-center justify-between pt-1">
        <button onclick="readFromClipboard()" class="text-xs text-brand-600 font-bold hover:underline flex items-center gap-1">
          <i data-lucide="clipboard" class="w-3.5 h-3.5"></i> 从剪贴板粘贴
        </button>
        <div class="flex gap-2">
          <button onclick="closeImportModal()" class="px-3.5 py-1.5 bg-stone-100 text-stone-600 rounded-xl text-xs font-bold">取消</button>
          <button onclick="doImportMealPlan()" class="px-4 py-1.5 bg-gradient-to-r from-rose-500 to-brand-500 text-white rounded-xl text-xs font-bold shadow-md shadow-rose-500/20">一键导入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 手机端底部纯净 3 项导航栏（彻底告别拥挤） -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-stone-200/80 px-8 py-2 flex items-center justify-around shadow-lg">
    <button onclick="switchTab('plan')" class="mobile-tab-btn flex flex-col items-center py-1 text-stone-400 font-bold text-[11px] transition-colors" data-tab="plan">
      <i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i>
      <span>周排餐</span>
    </button>
    <button onclick="switchTab('dishes')" class="mobile-tab-btn flex flex-col items-center py-1 text-stone-400 font-bold text-[11px] transition-colors" data-tab="dishes">
      <i data-lucide="book-open" class="w-5 h-5 mb-0.5"></i>
      <span>菜谱库</span>
    </button>
    <button onclick="switchTab('add')" class="mobile-tab-btn flex flex-col items-center py-1 text-stone-400 font-bold text-[11px] transition-colors" data-tab="add">
      <div class="w-10 h-10 -mt-4 bg-gradient-to-tr from-brand-500 to-amber-400 rounded-full flex items-center justify-center text-white shadow-md shadow-brand-500/30">
        <i data-lucide="plus" class="w-5 h-5"></i>
      </div>
      <span class="mt-0.5">拍新菜</span>
    </button>
  </nav>

  <!-- 轻量提示弹窗 Toast -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-2xl bg-stone-900/90 text-white text-xs font-bold shadow-xl flex items-center gap-2 pointer-events-none transition-all opacity-0 translate-y-[-10px]">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-message">提示内容</span>
  </div>

  <script src="app.js?v=20260923_v10"></script>
</body>
</html>
